<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kylian TCG</title>
<style>
  :root {
    --bg: #0d0f1a;
    --bg2: #171a2e;
    --text: #f2f3f8;
    --muted: #9aa0bd;
    --gold: #f5c542;
    --common: #8d93a8;
    --rare: #4da3ff;
    --epic: #b36bff;
    --legendary: #f5c542;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Trebuchet MS", system-ui, sans-serif;
    color: var(--text);
    background:
      radial-gradient(circle at 20% 10%, #25295a 0%, transparent 40%),
      radial-gradient(circle at 80% 90%, #3a1f5c 0%, transparent 40%),
      var(--bg);
    min-height: 100vh;
  }
  header { text-align: center; padding: 48px 20px 10px; }
  header h1 {
    font-size: clamp(2.2rem, 6vw, 4rem);
    letter-spacing: 4px;
    text-transform: uppercase;
    background: linear-gradient(90deg, #f5c542, #ff7a59, #b36bff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p { color: var(--muted); margin-top: 10px; }

  .stats {
    display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 22px 0 6px;
  }
  .stat {
    background: var(--bg2); border: 1px solid #2c3052; border-radius: 12px;
    padding: 10px 20px; font-size: .95rem;
  }
  .stat b { color: var(--gold); font-size: 1.15rem; }

  h2.section {
    text-align: center; margin: 40px 20px 18px; font-size: 1.4rem;
    letter-spacing: 3px; text-transform: uppercase; color: var(--text);
  }
  .hint { text-align: center; color: var(--muted); margin-bottom: 20px; font-size: .9rem; }

  /* ---- Paquets ---- */
  .packs {
    max-width: 1100px; margin: 0 auto; padding: 10px 20px;
    display: flex; flex-wrap: wrap; gap: 26px; justify-content: center;
  }
  .pack {
    width: 130px; aspect-ratio: 1 / 1.7; border-radius: 10px; position: relative;
    cursor: pointer; overflow: hidden;
    background: linear-gradient(160deg, #ff7a59 0%, #b36bff 55%, #4da3ff 100%);
    box-shadow: 0 10px 25px rgba(0,0,0,.5);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-align: center; transition: transform .2s, box-shadow .2s, filter .3s;
    border: 2px solid rgba(255,255,255,.35);
  }
  .pack::before, .pack::after {
    content: ""; position: absolute; left: 0; right: 0; height: 12px;
    background: repeating-linear-gradient(90deg, rgba(255,255,255,.55) 0 6px, transparent 6px 12px);
  }
  .pack::before { top: 0; }
  .pack::after { bottom: 0; }
  .pack .shine {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.5) 50%, transparent 70%);
    background-size: 250% 100%; background-position: 150% 0; transition: background-position .8s;
  }
  .pack:hover .shine { background-position: -50% 0; }
  .pack:hover { transform: translateY(-8px) rotate(-3deg); box-shadow: 0 18px 35px rgba(0,0,0,.6), 0 0 25px #b36bff; }
  .pack .logo { font-weight: 900; letter-spacing: 2px; font-size: 1.05rem; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .pack .count { font-size: .75rem; background: rgba(0,0,0,.4); padding: 3px 10px; border-radius: 999px; }
  .pack .emblem { font-size: 2.4rem; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
  .pack.opened { filter: grayscale(1) brightness(.4); cursor: default; pointer-events: none; }
  .pack.opened .emblem::after { content: ""; }
  .pack.tearing { animation: tear .6s forwards; pointer-events: none; }
  @keyframes tear {
    0% { transform: scale(1) rotate(0); }
    30% { transform: scale(1.12) rotate(-6deg); }
    60% { transform: scale(1.18) rotate(5deg); filter: brightness(1.8); }
    100% { transform: scale(1.5) rotate(0); opacity: 0; filter: brightness(3); }
  }
  .complete { text-align: center; color: var(--gold); font-weight: bold; margin: 14px 0; min-height: 1.2em; }

  .actions { text-align: center; margin-top: 10px; }
  .btn {
    background: var(--bg2); color: var(--text); border: 1px solid #2c3052;
    padding: 9px 20px; border-radius: 999px; cursor: pointer; font-size: .9rem; transition: .2s;
  }
  .btn:hover { border-color: var(--gold); }
  .btn.primary { background: var(--gold); color: #1a1a1a; border-color: var(--gold); font-weight: bold; }

  /* ---- Filtres ---- */
  .filters { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; padding: 6px 20px 26px; }
  .filters button {
    background: var(--bg2); color: var(--text); border: 1px solid #2c3052;
    padding: 8px 18px; border-radius: 999px; cursor: pointer; font-size: .9rem; transition: .2s;
  }
  .filters button:hover { border-color: var(--gold); }
  .filters button.active { background: var(--gold); color: #1a1a1a; border-color: var(--gold); font-weight: bold; }

  /* ---- Collection ---- */
  .grid {
    max-width: 1200px; margin: 0 auto; padding: 0 20px 80px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 32px;
    justify-items: center;
  }

  /* ---- Carte ---- */
  .card {
    --c: var(--common);
    width: 250px; aspect-ratio: 2.5 / 3.5;
    border-radius: 16px; padding: 10px;
    background: linear-gradient(145deg, var(--c), #1b1e33 60%);
    box-shadow: 0 10px 30px rgba(0,0,0,.5);
    position: relative; cursor: pointer;
    transform-style: preserve-3d;
    transition: transform .15s ease-out, box-shadow .2s;
    overflow: hidden;
  }
  .card[data-rarity="rare"] { --c: var(--rare); }
  .card[data-rarity="epic"] { --c: var(--epic); }
  .card[data-rarity="legendary"] { --c: var(--legendary); }
  .card:hover { box-shadow: 0 18px 45px rgba(0,0,0,.7), 0 0 25px var(--c); }

  .card::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(115deg, transparent 20%, rgba(255,255,255,.35) 40%, rgba(255,255,255,.05) 50%, transparent 70%);
    background-size: 250% 250%;
    background-position: var(--mx, 50%) var(--my, 50%);
    mix-blend-mode: overlay; opacity: 0; transition: opacity .2s;
  }
  .card:hover::after { opacity: 1; }

  .inner {
    height: 100%; border-radius: 10px; background: #121427;
    display: flex; flex-direction: column; padding: 8px; gap: 6px;
  }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
  .name { font-size: 1rem; min-height: 1.2em; flex: 1; }
  .num { font-size: .75rem; color: var(--muted); }

  .art {
    position: relative; flex: 0 0 52%; border-radius: 8px; overflow: hidden;
    border: 2px solid var(--c);
    background: repeating-linear-gradient(45deg, #1c1f3a, #1c1f3a 10px, #20244a 10px, #20244a 20px);
    display: grid; place-items: center;
  }
  .art::before { content: "📷 Photo"; color: var(--muted); font-size: .85rem; }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

  .badges { display: flex; justify-content: space-between; align-items: center; font-size: .7rem; text-transform: uppercase; letter-spacing: 1px; }
  .rarity { color: var(--c); font-weight: bold; }
  .type { min-height: 1em; color: var(--muted); }

  .desc {
    flex: 1; font-size: .8rem; line-height: 1.35; color: #d7daea;
    background: #0c0e1c; border-radius: 6px; padding: 8px; min-height: 60px;
    overflow: auto;
  }

  /* ---- Dos de carte (non obtenue) ---- */
  .cardback {
    width: 250px; aspect-ratio: 2.5 / 3.5; border-radius: 16px; padding: 10px;
    background: linear-gradient(145deg, #3a3f6b, #161830);
    box-shadow: 0 10px 30px rgba(0,0,0,.5); position: relative;
  }
  .cardback .pattern {
    height: 100%; border-radius: 10px; border: 2px solid rgba(255,255,255,.18);
    background:
      repeating-linear-gradient(45deg, rgba(255,255,255,.04) 0 12px, transparent 12px 24px),
      radial-gradient(circle at 50% 50%, #2a2e5a, #11132a);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
  }
  .cardback .k { font-size: 3.4rem; font-weight: 900; color: var(--gold); text-shadow: 0 0 20px rgba(245,197,66,.5); }
  .cardback .t { font-size: .7rem; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; }
  .cardback.locked { filter: brightness(.55) saturate(.6); }
  .cardback.locked .k { color: #5b6090; text-shadow: none; }

  /* ---- Modales ---- */
  .modal {
    position: fixed; inset: 0; background: rgba(5,6,12,.92); display: none;
    flex-direction: column; align-items: center; justify-content: center; z-index: 10;
    padding: 20px; gap: 24px; overflow-y: auto;
  }
  .modal.open { display: flex; }
  .modal .close {
    position: absolute; top: 14px; right: 22px; font-size: 2rem; color: #fff;
    background: none; border: none; cursor: pointer; z-index: 2;
  }
  .modal h3 { letter-spacing: 3px; text-transform: uppercase; }
  #modal-slot .card { width: min(380px, 90vw); cursor: default; }

  .reveal-row {
    display: flex; flex-wrap: wrap; gap: 18px; justify-content: center; max-width: 1200px;
  }
  .flipper { --w: 200px; width: var(--w); aspect-ratio: 2.5 / 3.5; perspective: 900px; cursor: pointer; }
  .flipper-inner {
    position: relative; width: 100%; height: 100%;
    transition: transform .7s cubic-bezier(.3,.8,.3,1); transform-style: preserve-3d;
  }
  .flipper.flipped .flipper-inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
  .face.front { transform: rotateY(180deg); }
  .face .card, .face .cardback { width: 100%; height: 100%; }
  .face .card .name { font-size: .85rem; }
  .face .card .desc { font-size: .68rem; min-height: 40px; padding: 5px; }
  .flipper.pop-legendary .face.front .card { box-shadow: 0 0 40px 8px var(--legendary); }
  .flipper.pop-epic .face.front .card { box-shadow: 0 0 30px 6px var(--epic); }
  .flipper.pop-rare .face.front .card { box-shadow: 0 0 22px 4px var(--rare); }
  .flipper:not(.flipped):hover .flipper-inner { transform: translateY(-6px) rotateY(8deg); }
  .flipper.flipped { cursor: zoom-in; }
  .flipper { transition: transform .5s ease, opacity .5s ease; }
  .reveal-count { color: var(--muted); letter-spacing: 2px; text-transform: uppercase; font-size: .85rem; margin-top: -10px; }

  /* Pile de cartes : les cartes se superposent, on les voit une par une */
  .reveal-row.stacked {
    position: relative; display: block;
    width: min(260px, 70vw); aspect-ratio: 2.5 / 3.5;
    margin: 10px 0 20px;
  }
  .reveal-row.stacked .flipper { position: absolute; inset: 0; width: 100%; --w: 100%; }
  .reveal-row.stacked .flipper:not(.top) { pointer-events: none; }
  .reveal-row.stacked .flipper.gone {
    transform: translateX(130%) rotate(20deg) !important;
    opacity: 0; pointer-events: none;
  }
  .reveal-row.stacked .face .card .name { font-size: 1rem; }
  .reveal-row.stacked .face .card .desc { font-size: .8rem; }
  .reveal-actions { display: flex; gap: 12px; }

  footer { text-align: center; color: var(--muted); padding: 30px; font-size: .85rem; }
</style>
</head>
<body>

<header>
  <h1>Kylian TCG</h1>
  <p>Ouvre tes 8 paquets de 5 cartes et complète la collection de 40 cartes</p>
  <div class="stats">
    <div class="stat">Cartes obtenues : <b id="stat-cards">0</b> / <span id="stat-total">40</span></div>
    <div class="stat">Paquets restants : <b id="stat-packs">8</b> / 8</div>
  </div>
</header>

<h2 class="section">Paquets</h2>
<p class="hint">Clique sur un paquet pour l'ouvrir</p>
<div class="packs" id="packs"></div>
<p class="complete" id="complete"></p>
<div class="actions"><button class="btn" id="reset">↺ Réinitialiser la collection</button></div>

<h2 class="section">Ma collection</h2>
<div class="filters">
  <button class="active" data-filter="all">Toutes</button>
  <button data-filter="common">Commune</button>
  <button data-filter="rare">Rare</button>
  <button data-filter="epic">Épique</button>
  <button data-filter="legendary">Légendaire</button>
</div>
<main class="grid" id="grid"></main>

<!-- Ouverture d'un paquet -->
<div class="modal" id="reveal-modal">
  <h3>Nouveau paquet !</h3>
  <p class="reveal-count" id="reveal-count"></p>
  <div class="reveal-row stacked" id="reveal-row"></div>
  <div class="reveal-actions">
    <button class="btn primary" id="reveal-next">Retourner la carte</button>
    <button class="btn" id="reveal-all">Tout révéler</button>
    <button class="btn" id="reveal-close">Fermer</button>
  </div>
</div>

<!-- Carte agrandie -->
<div class="modal" id="zoom-modal">
  <button class="close" aria-label="Fermer">×</button>
  <div id="modal-slot"></div>
</div>

<footer>Kylian TCG · Tous droits réservés</footer>

<script>
  /* =====================================================================
     TES 40 CARTES
     Remplis pour chaque carte :
       name   : le nom de la carte
       img    : le chemin de la photo, ex. "images/kylian1.jpg"
       desc   : la description
       type   : un petit label (optionnel), ex. "Soirée", "Vacances"
       rarity : "common", "rare", "epic" ou "legendary"
     Le numéro (#001, #002…) est automatique selon l'ordre de la liste.
     ===================================================================== */
  const CARDS = [
    // ---- 20 communes ----
    { name: "Kylian Lloris", img: "img/Kylian, gardien lunaire des météorites.png", desc: "", type: "", rarity: "common" },
    { name: "Radin", img: "img/Kylian, plongeur du canapé géant.png", desc: "", type: "", rarity: "common" },
    { name: "Archéologue", img: "img/L’archéologue du câble USB fossilisé.png", desc: "", type: "", rarity: "common" },
    { name: "Wi-fi", img: "img/L’exorciste de la box Wi‑Fi.png", desc: "", type: "", rarity: "common" },
    { name: "Pigeon", img: "img/L’héritier royal des pigeons.png", desc: "", type: "", rarity: "common" },
    { name: "Météo", img: "img/Le bulletin météo du réfrigérateur.png", desc: "", type: "", rarity: "common" },
    { name: "Cuisto", img: "img/Le chef étoilé du micro-ondes.png", desc: "", type: "", rarity: "common" },
    { name: "Chirurgien", img: "img/Le chirurgien de la dernière chips.png", desc: "", type: "", rarity: "common" },
    { name: "Chaussette", img: "img/Le conseil des chaussettes orphelines.png", desc: "", type: "", rarity: "common" },
    { name: "Pizza", img: "img/Le livreur de pizza face au T-Rex.png", desc: "", type: "", rarity: "common" },
    { name: "Prêtre", img: "img/Le miracle de l’imprimante médiévale.png", desc: "", type: "", rarity: "common" },
    { name: "Le dompteur", img: "img/Le négociateur, le croissant et les oies.png", desc: "", type: "", rarity: "common" },
    { name: "Le photographe", img: "img/Le photographe des mariés squelettes.png", desc: "", type: "", rarity: "common" },
    { name: "Harry Péteur", img: "img/Le sorcier réparateur de dragons.png", desc: "", type: "", rarity: "common" },
    { name: "Bohnome de neige", img: "img/Le thanatopracteur des bonshommes de neige.png", desc: "", type: "", rarity: "common" },
    { name: "Il pêche quoi même", img: "img/Pêcheur de nuages au coucher du soleil.png", desc: "", type: "", rarity: "common" },
    { name: "Momie (Raph)", img: "img/SAV des momies dans la pyramide.png", desc: "", type: "", rarity: "common" },
    { name: "Magicien", img: "img/Téléachat, pierre maudite et mains fantomatiques.png", desc: "", type: "", rarity: "common" },
    { name: "Kylian videur ?", img: "img/Videur de pingouins dans l’iceberg.png", desc: "", type: "", rarity: "common" },
    { name: "La DS3 du daron", img: "img/C2wKN.jpg", desc: "", type: "", rarity: "common" },
    // ---- 11 rares ----
    { name: "Kyky Braqueur", img: "img/Braquage de la dernière frite.png", desc: "Bro a cru il était Tom Cruise", type: "", rarity: "rare" },
    { name: "J.O", img: "img/Champion olympique du lancer de pantoufle.png", desc: "POV: Le seul sport ou il est bon: lancer la pantoufle pour éteindre la lumière", type: "", rarity: "rare" },
    { name: "Moustique", img: "img/Chasse nocturne au moustique géant.png", desc: "On dirait Indiana Jones en 2090 frr", type: "", rarity: "rare" },
    { name: "Chevalier", img: "img/Chevalier baroque en claquettes, cathédrale en ruine.png", desc: "Il s'est cru dans elden ring ou c'est comment ?", type: "", rarity: "rare" },
    { name: "Douanier", img: "img/Douane infernale au guichet.png", desc: "Si le gars était noir ce serait bien plus problématique", type: "", rarity: "rare" },
    { name: "Avocat", img: "img/Kylian avocat du grille-pain.png", desc: "Même avec un job stylé il fait quand même de la merde", type: "", rarity: "rare" },
    { name: "Chef d'orchestre", img: "img/Kylian dirige l’orchestre des canards.png", desc: "coin coin.", type: "", rarity: "rare" },
    { name: "Red Dead Nulos 2", img: "img/Kylian dompte l’aspirateur robot.png", desc: "Arthur Morgan a la retraite", type: "", rarity: "rare" },
    { name: "Ovni", img: "img/Kylian inspecte un OVNI cabossé.png", desc: "Pov: il répare la voiture de sa soeur", type: "", rarity: "rare" },
    { name: "Turbo", img: "img/Kylian jockey sur un escargot géant.png", desc: "Même PIXAR est choqué de l'idée", type: "", rarity: "rare" },
    { name: "DJ", img: "img/Kylian, DJ de la maison hantée(1).png", desc: "OUAIS DJ KYKY", type: "", rarity: "rare" },
    // ---- 6 épiques ----
    { name: "Avec le Z", img: "img/Câlin surprise entre Kylian et Éric Zemmour.png", desc: "Quand kyky rencontre son ame soeur -->", type: "", rarity: "epic" },
    { name: "Ninja", img: "img/Capitaine du Gotei 13 à la baguette.png", desc: "Attention kylian tu risque de te faire mal", type: "", rarity: "epic" },
    { name: "Lidl", img: "img/Le boss final du Lidl.png", desc: "Bro à la carte Lidl pro max ++", type: "", rarity: "epic" },
    { name: "Verstappute", img: "img/Kylian, roi du circuit en tondeuse.png", desc: "Même Hamilton est choqué du manque de charisme", type: "", rarity: "epic" },
    { name: "Croque-mort", img: "img/Stagiaire croque-mort à la pelle dorée.png", desc: "tellment il est petit le costume est gigantesque (cest du xxs miskine)", type: "", rarity: "epic" },
    { name: "Pause caf", img: "img/Bureau en fuite, café intact.png", desc: "C'est moi ou il a le cul en feu ?", type: "", rarity: "epic" },
    // ---- 3 légendaires ----
    { name: "Avec Manu", img: "img/IMG_3986.png", desc: "Quand kyky à trouvé son amoureuse:", type: "", rarity: "legendary" },
    { name: "La familia", img: "img/IMG_3987.png", desc: "C'est donc pour ça qu'il a eu son bac le kyky", type: "", rarity: "legendary" },
    { name: "En manif", img: "img/rfJW7.jpg", desc: "Quand kyky vole le tshirt de Mr Laur et fait manif avec, Marine et Jordan ne sont pas contents :(", type: "", rarity: "legendary" }
  ];

  const CARDS_PER_PACK = 5;
  const PACK_COUNT = 8; // 8 paquets x 5 cartes = 40 cartes
  const STORAGE_KEY = "kylian-tcg-v1";
  const RARITY_LABEL = { common: "Commune", rare: "Rare", epic: "Épique", legendary: "Légendaire" };

  /* ---------- État (sauvegardé dans le navigateur) ---------- */
  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function newState() {
    // Les 40 cartes sont mélangées une fois, puis découpées en 8 paquets de 5 :
    // en ouvrant les 8 paquets, tu obtiens chaque carte exactement une fois.
    return { order: shuffle(CARDS.map((_, i) => i)), opened: 0 };
  }
  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if (s && Array.isArray(s.order) && s.order.length === CARDS.length &&
          Number.isInteger(s.opened) && s.opened >= 0 && s.opened <= PACK_COUNT) return s;
    } catch (e) {}
    return newState();
  }
  function saveState() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
  }
  let state = loadState();
  saveState();

  /* ---------- Construction des cartes ---------- */
  function pad(n) { return String(n).padStart(3, "0"); }

  function makeCard(id) {
    const d = CARDS[id];
    const el = document.createElement("article");
    el.className = "card";
    el.dataset.rarity = d.rarity;
    el.innerHTML =
      '<div class="inner">' +
        '<div class="top"><h3 class="name"></h3><span class="num"></span></div>' +
        '<div class="art"></div>' +
        '<div class="badges"><span class="rarity"></span><span class="type"></span></div>' +
        '<p class="desc"></p>' +
      '</div>';
    el.querySelector(".name").textContent = d.name;
    el.querySelector(".num").textContent = "#" + pad(id + 1);
    el.querySelector(".rarity").textContent = RARITY_LABEL[d.rarity];
    el.querySelector(".type").textContent = d.type;
    el.querySelector(".desc").textContent = d.desc;
    if (d.img) {
      const img = document.createElement("img");
      img.src = d.img;
      img.alt = d.name || "Kylian";
      el.querySelector(".art").appendChild(img);
    }
    return el;
  }

  function makeBack(id, locked) {
    const el = document.createElement("div");
    el.className = "cardback" + (locked ? " locked" : "");
    el.innerHTML = '<div class="pattern"><div class="k">K</div><div class="t"></div></div>';
    el.querySelector(".t").textContent = locked ? "#" + pad(id + 1) : "Kylian TCG";
    return el;
  }

  function bindTilt(card) {
    card.addEventListener("mousemove", e => {
      const r = card.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      const y = (e.clientY - r.top) / r.height;
      card.style.transform = `perspective(700px) rotateY(${(x - .5) * 18}deg) rotateX(${(.5 - y) * 18}deg) scale(1.04)`;
      card.style.setProperty("--mx", (x * 100) + "%");
      card.style.setProperty("--my", (y * 100) + "%");
    });
    card.addEventListener("mouseleave", () => { card.style.transform = ""; });
  }

  /* ---------- Affichage : stats, paquets, collection ---------- */
  const packsEl = document.getElementById("packs");
  const gridEl = document.getElementById("grid");
  let currentFilter = "all";

  function ownedIds() {
    return new Set(state.order.slice(0, state.opened * CARDS_PER_PACK));
  }

  function renderStats() {
    document.getElementById("stat-cards").textContent = state.opened * CARDS_PER_PACK;
    document.getElementById("stat-total").textContent = CARDS.length;
    document.getElementById("stat-packs").textContent = PACK_COUNT - state.opened;
    document.getElementById("complete").textContent =
      state.opened >= PACK_COUNT ? "🏆 Collection complète !" : "";
  }

  function renderPacks() {
    packsEl.innerHTML = "";
    for (let i = 0; i < PACK_COUNT; i++) {
      const p = document.createElement("div");
      const isOpened = i < state.opened;
      p.className = "pack" + (isOpened ? " opened" : "");
      p.innerHTML =
        '<div class="shine"></div>' +
        '<div class="logo">KYLIAN<br>TCG</div>' +
        '<div class="emblem">' + (isOpened ? "✔" : "★") + '</div>' +
        '<div class="count">' + (isOpened ? "Ouvert" : CARDS_PER_PACK + " cartes") + '</div>';
      if (!isOpened) p.addEventListener("click", () => openPack(p));
      packsEl.appendChild(p);
    }
  }

  function renderCollection() {
    const owned = ownedIds();
    gridEl.innerHTML = "";
    CARDS.forEach((d, id) => {
      const has = owned.has(id);
      let el;
      if (has) {
        el = makeCard(id);
        bindTilt(el);
        el.addEventListener("click", () => zoomCard(id));
      } else {
        el = makeBack(id, true);
      }
      el.dataset.owned = has ? "1" : "0";
      el.dataset.rarityKey = d.rarity;
      gridEl.appendChild(el);
    });
    applyFilter();
  }

  function applyFilter() {
    gridEl.querySelectorAll("[data-owned]").forEach(el => {
      const show = currentFilter === "all" ||
        (el.dataset.owned === "1" && el.dataset.rarityKey === currentFilter);
      el.style.display = show ? "" : "none";
    });
  }

  document.querySelectorAll(".filters button").forEach(btn => {
    btn.addEventListener("click", () => {
      document.querySelectorAll(".filters button").forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentFilter = btn.dataset.filter;
      applyFilter();
    });
  });

  /* ---------- Ouverture d'un paquet ---------- */
  const revealModal = document.getElementById("reveal-modal");
  const revealRow = document.getElementById("reveal-row");

  function openPack(packEl) {
    if (state.opened >= PACK_COUNT) return;
    const start = state.opened * CARDS_PER_PACK;
    const ids = state.order.slice(start, start + CARDS_PER_PACK);
    state.opened++;      // le paquet est compté tout de suite (pas de reroll en rechargeant)
    saveState();

    packEl.classList.add("tearing");
    setTimeout(() => {
      showReveal(ids);
      renderStats();
      renderPacks();
    }, 600);
  }

  let revealIds = [];
  let revealIdx = 0; // index de la carte du dessus dans la pile

  function showReveal(ids) {
    revealIds = ids;
    revealIdx = 0;
    revealRow.innerHTML = "";
    revealRow.className = "reveal-row stacked";
    ids.forEach(id => {
      const f = document.createElement("div");
      f.className = "flipper";
      f.dataset.rarity = CARDS[id].rarity;
      f.innerHTML =
        '<div class="flipper-inner">' +
          '<div class="face back"></div>' +
          '<div class="face front"></div>' +
        '</div>';
      f.querySelector(".back").appendChild(makeBack(id, false));
      const card = makeCard(id);
      bindTilt(card);
      f.querySelector(".front").appendChild(card);
      f.addEventListener("click", () => {
        // Dans la pile, seule la carte du dessus réagit
        if (revealRow.classList.contains("stacked") && !f.classList.contains("top")) return;
        // 1er clic : on retourne la carte. Clic suivant : on l'agrandit.
        if (f.classList.contains("flipped")) zoomCard(id);
        else flip(f, CARDS[id].rarity);
        updateRevealUI();
      });
      revealRow.appendChild(f);
    });
    layoutStack();
    updateRevealUI();
    revealModal.classList.add("open");
  }

  // Place les cartes en pile : la 1re au-dessus, les cartes déjà vues s'envolent
  function layoutStack() {
    const fl = Array.from(revealRow.children);
    fl.forEach((f, i) => {
      f.classList.remove("top", "gone");
      if (i < revealIdx) {
        f.classList.add("gone");
        f.style.zIndex = 0;
        f.style.transform = "";
        return;
      }
      const depth = i - revealIdx;
      f.style.zIndex = fl.length - depth;
      const rot = depth === 0 ? 0 : (depth % 2 ? 2 : -2);
      f.style.transform = `translate(${depth * 7}px, ${depth * 6}px) rotate(${rot}deg)`;
      if (depth === 0) f.classList.add("top");
    });
  }

  const revealCount = document.getElementById("reveal-count");
  const revealNext = document.getElementById("reveal-next");
  const revealAll = document.getElementById("reveal-all");

  function updateRevealUI() {
    const n = revealIds.length;
    if (!revealRow.classList.contains("stacked")) {
      revealCount.textContent = "Ton paquet";
      revealNext.style.display = "none";
      revealAll.style.display = "none";
      return;
    }
    revealNext.style.display = "";
    revealAll.style.display = "";
    revealCount.textContent = "Carte " + (revealIdx + 1) + " / " + n;
    const top = revealRow.children[revealIdx];
    const flipped = top && top.classList.contains("flipped");
    revealNext.textContent = !flipped ? "Retourner la carte"
      : (revealIdx < n - 1 ? "Carte suivante →" : "Voir tout le paquet");
  }

  // Étale les 5 cartes côte à côte, toutes retournées
  function spreadCards() {
    revealRow.classList.remove("stacked");
    Array.from(revealRow.children).forEach((f, i) => {
      f.classList.remove("top", "gone");
      f.style.zIndex = "";
      f.style.transform = "";
      setTimeout(() => flip(f, f.dataset.rarity), i * 200);
    });
    updateRevealUI();
  }

  revealNext.addEventListener("click", () => {
    const top = revealRow.children[revealIdx];
    if (!top) return;
    if (!top.classList.contains("flipped")) {
      flip(top, top.dataset.rarity);
    } else if (revealIdx < revealIds.length - 1) {
      revealIdx++;
      layoutStack();
    } else {
      spreadCards();
    }
    updateRevealUI();
  });

  function flip(f, rarity) {
    if (f.classList.contains("flipped")) return;
    f.classList.add("flipped", "pop-" + rarity);
  }

  revealAll.addEventListener("click", spreadCards);

  function closeReveal() {
    revealModal.classList.remove("open");
    renderCollection();
  }
  document.getElementById("reveal-close").addEventListener("click", closeReveal);

  /* ---------- Carte agrandie ---------- */
  const zoomModal = document.getElementById("zoom-modal");
  const slot = document.getElementById("modal-slot");
  function zoomCard(id) {
    slot.innerHTML = "";
    const c = makeCard(id);
    c.style.cursor = "default";
    bindTilt(c);
    slot.appendChild(c);
    zoomModal.classList.add("open");
  }
  zoomModal.addEventListener("click", e => {
    if (e.target === zoomModal || e.target.classList.contains("close")) zoomModal.classList.remove("open");
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Escape") {
      // Échap ferme d'abord la carte agrandie, puis le paquet
      if (zoomModal.classList.contains("open")) zoomModal.classList.remove("open");
      else if (revealModal.classList.contains("open")) closeReveal();
    }
  });

  /* ---------- Réinitialisation ---------- */
  document.getElementById("reset").addEventListener("click", () => {
    if (!confirm("Tout réinitialiser ? Les paquets seront remélangés et ta collection effacée.")) return;
    state = newState();
    saveState();
    renderStats();
    renderPacks();
    renderCollection();
  });

  /* ---------- Démarrage ---------- */
  renderStats();
  renderPacks();
  renderCollection();
</script>
</body>
</html>
